<template id="client-card-template">
  <div
    class="project-card"
    style="
      background: var(--bg-surface);
      padding: 1.75rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      transition: border-color 0.2s;
    "
  >
    <h3
      class="card-title"
      style="
        margin-bottom: 0.5rem;
        font-size: 1.25rem;
        color: var(--text-primary);
        font-weight: 600;
      "
    ></h3>
    <p
      class="card-date"
      style="font-size: 0.8rem; color: var(--text-secondary)"
    ></p>
    <div
      style="
        margin-top: 1rem;
        font-size: 0.9rem;
        color: var(--accent);
        font-weight: 500;
      "
    >
      View Case Study →
    </div>
  </div>
</template>

<template id="admin-card-template">
  <div
    class="admin-card"
    style="
      background: var(--bg-surface);
      border: 1px solid var(--border);
      padding: 1.5rem;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    "
  >
    <div>
      <h3
        class="card-title"
        style="
          font-size: 1.2rem;
          color: white;
          margin: 0 0 0.25rem 0;
          font-weight: 600;
        "
      ></h3>
      <span
        class="card-slug"
        style="
          font-size: 0.75rem;
          color: var(--text-secondary);
          background: var(--bg-dark);
          padding: 0.25rem 0.5rem;
          border-radius: 4px;
        "
      ></span>
    </div>
    <div
      style="
        display: flex;
        gap: 0.5rem;
        margin-top: auto;
        padding-top: 1rem;
        border-top: 1px solid var(--border);
      "
    >
      <button
        data-action="edit"
        class="btn-edit"
        style="
          flex: 1;
          padding: 0.5rem;
          background: var(--bg-dark);
          border: 1px solid var(--border);
          color: white;
          border-radius: 4px;
          font-weight: 600;
          cursor: pointer;
        "
      >
        Edit
      </button>
      <button
        data-action="delete"
        class="btn-delete"
        style="
          padding: 0.5rem;
          background: rgba(239, 68, 68, 0.1);
          border: 1px solid #ef4444;
          color: #ef4444;
          border-radius: 4px;
          cursor: pointer;
        "
      >
        Delete
      </button>
    </div>
  </div>
</template>
