<!-- templates/cardComponent.html -->
<template id="client-card-template">
  <div class="project-card">
    <div class="card-cover-container">
      <img class="card-cover" src="" alt="Project Preview Cover" />
    </div>
    <div class="card-body">
      <h3 class="card-title"></h3>
      <p class="project-description"></p>
      <div class="card-tags-row"></div>
      <p class="card-date"></p>
    </div>
  </div>
</template>

<template id="admin-card-template">
  <div class="admin-card">
    <div class="card-cover-container">
      <img class="card-cover" src="" alt="Admin Project Preview Cover" />
    </div>
    <div class="admin-card-header">
      <h3 class="card-title"></h3>
      <span class="card-slug"></span>
    </div>
    <p class="project-description"></p>
    <div class="card-tags-row"></div>
    <p class="card-date"></p>

    <!-- Anchors targeted dynamically for scalable button injection -->
    <div class="admin-controls-footer"></div>
  </div>
</template>
