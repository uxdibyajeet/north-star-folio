<div
  class="workspace-wrapper"
  style="
    max-width: 1400px;
    margin: 1.5rem auto;
    padding: 0 1.5rem;
    font-family: system-ui, sans-serif;
  "
>
  <div
    style="
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 3rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 1.5rem;
    "
  >
    <div>
      <h1
        style="
          font-size: 2rem;
          color: var(--text-primary);
          font-weight: 700;
          letter-spacing: -0.02em;
          margin: 0 0 0.25rem 0;
        "
      >
        Dashboard
      </h1>
      <p style="color: var(--text-secondary); font-size: 0.9rem; margin: 0">
        Manage, update, and publish case studies.
      </p>
    </div>
    <button
      id="add-new-project-cta"
      style="
        padding: 0.75rem 1.5rem;
        background: var(--accent, #0071e3);
        color: white;
        border: none;
        border-radius: 6px;
        font-weight: 600;
        font-size: 0.9rem;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 0.5rem;
      "
    >
      <span>＋</span> Create New Project
    </button>
  </div>

  <div
    id="admin-projects-list-grid"
    style="
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.5rem;
    "
  >
    <p style="color: var(--text-secondary)">
      Querying administrative project indexes...
    </p>
  </div>
</div>
