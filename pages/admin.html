<section class="page-container">
  <div class="admin-auth">
    <div class="admin-card">
      <!-- STEP 1: CREDENTIALS LOGIN -->
      <form class="auth-step" id="admin-login-form" method="post" action="">
        <h1>Admin Login</h1>
        <p>Access the dashboard securely.</p>

        <label for="admin-email">Email</label>
        <input
          id="admin-email"
          name="email"
          type="email"
          placeholder="Enter email"
          required
        />

        <label for="admin-password">Password</label>
        <input
          id="admin-password"
          name="password"
          type="password"
          placeholder="Enter password"
          required
        />

        <button type="submit" class="btn btn-primary">Continue</button>
      </form>

      <!-- STEP 2: MFA ENROLLMENT (QR CODE) -->
      <div class="auth-step" id="authenticator-step" hidden>
        <h1>Set Up Authenticator</h1>
        <p class="helper-text">
          Scan this QR code in your authenticator app to link your account.
        </p>
        <div class="qr-box" aria-label="Authenticator QR code placeholder">
          <span>SCAN ME</span>
        </div>
        <button id="continue-to-code-btn" type="button" class="btn btn-primary">
          Continue to verification
        </button>
      </div>

      <!-- STEP 3: VERIFY TOTP CODE -->
      <div class="auth-step" id="two-factor-step" hidden>
        <h1>Verify Your Identity</h1>
        <p class="helper-text">
          Enter the 6-digit code from your authenticator app.
        </p>
        <input
          id="admin-code"
          type="text"
          inputmode="numeric"
          maxlength="6"
          placeholder="Enter 6-digit code"
        />
        <button id="verify-code-btn" type="button" class="btn btn-primary">
          Verify Code
        </button>
      </div>

      <!-- GLOBAL FEEDBACK STATUS -->
      <!-- Moved outside individual steps to catch errors at any phase -->
      <p
        id="auth-status"
        class="helper-text"
        style="text-align: center; margin-top: 1rem; font-weight: 500"
      ></p>
    </div>
  </div>
</section>
